<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>OMNIH - Iniciar Sesión</title>
  <style>
    :root {
      --bg-canvas: #edf2f7;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --accent-gold: #c5a059;
      --border-color: #e2e8f0;
      --active-blue: #3182ce;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-canvas);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border: 1px solid var(--border-color);
      position: relative;
      padding: 1.5rem 1.25rem;
    }

    /* BARRA SUPERIOR: SOLO ELEMENTO IDENTITARIO */
    .top-navbar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 0.25rem;
    }

    /* CONTENEDOR MAESTRO CENTRALIZADO DEL LOGO (Arriba y a la Izquierda) */
    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      touch-action: manipulation;
    }

    /* CORRECCIÓN TÉCNICA: Bloqueo explícito en px y aspect-ratio */
    .dna-box {
      width: 20px;
      height: 40px;
      aspect-ratio: 1 / 2;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .dna-icon {
      width: 20px;
      height: 40px;
      transform: rotate(45deg);
      transform-origin: center;
      overflow: visible;
      display: block;
    }

    .text-omnih {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 35%, #ca8a04 70%, #854d0e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Arial', sans-serif;
      line-height: 1;
    }

    /* SUB-LÍNEA: PROTOCOLO - INICIAR SESIÓN */
    .protocol-subbar {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .header-protocol-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
    }

    .form-body {
      padding: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }

    .form-group input:focus {
      border-color: #63b3ed;
      box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #90cdf4 0%, #bee3f8 50%, #ffffff 100%);
      color: #1a365d;
      border: 1px solid #90cdf4;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(144, 205, 244, 0.35);
      touch-action: manipulation;
      user-select: none;
    }

    .btn-submit:hover, .btn-submit:active {
      background: linear-gradient(135deg, #bee3f8 0%, #ebf8ff 60%, #ffffff 100%);
      color: var(--active-blue);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(144, 205, 244, 0.5);
    }

    .quote-box {
      background-color: #f8fafc;
      border-left: 4px solid var(--accent-gold);
      padding: 14px 16px;
      margin-top: 24px;
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem;
      color: var(--text-dark);
      line-height: 1.5;
    }

    .quote-text {
      font-style: italic;
      color: var(--text-muted);
    }

    .quote-source {
      display: block;
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- BARRA SUPERIOR: SOLO ELEMENTO IDENTITARIO -->
  <div class="top-navbar">
    <a href="index.html" class="brand-logo-link" title="Ir al Inicio">
      <div class="dna-box">
        <!-- SVG blindado con ancho/alto explícitos y preserveAspectRatio -->
        <svg viewBox="0 0 120 240" width="20" height="40" preserveAspectRatio="xMidYMid meet" class="dna-icon" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hebraFondo" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#b03a8a" />
              <stop offset="35%" stop-color="#704fa0" />
              <stop offset="70%" stop-color="#3b7cb3" />
              <stop offset="100%" stop-color="#4aa47a" />
            </linearGradient>

            <linearGradient id="hebraFrente" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#d95438" />
              <stop offset="40%" stop-color="#f0a441" />
              <stop offset="80%" stop-color="#e1c662" />
              <stop offset="100%" stop-color="#cbaf4b" />
            </linearGradient>
          </defs>

          <!-- Peldaños conectores -->
          <g stroke-width="4.5" stroke-linecap="round" opacity="0.85">
            <line x1="34" y1="35" x2="86" y2="35" stroke="#b03a8a" />
            <line x1="34" y1="65" x2="86" y2="65" stroke="#704fa0" />
            <line x1="34" y1="95" x2="86" y2="95" stroke="#3b7cb3" />
            <line x1="34" y1="125" x2="86" y2="125" stroke="#4aa47a" />
            <line x1="34" y1="155" x2="86" y2="155" stroke="#d95438" />
            <line x1="34" y1="185" x2="86" y2="185" stroke="#f0a441" />
            <line x1="34" y1="215" x2="86" y2="215" stroke="#e1c662" />
          </g>
          
          <!-- Hebra 1 -->
          <path d="M 30,15 C 30,50 90,50 90,85 C 90,120 30,120 30,155 C 30,190 90,190 90,225" 
                fill="none" stroke="url(#hebraFondo)" stroke-width="11" stroke-linecap="round" />
          
          <!-- Hebra 2 -->
          <path d="M 90,15 C 90,50 30,50 30,85 C 30,120 90,120 90,155 C 90,190 30,190 30,225" 
                fill="none" stroke="url(#hebraFrente)" stroke-width="11" stroke-linecap="round" />
        </svg>
      </div>
      <div class="text-omnih">OMNIH</div>
    </a>
  </div>

  <!-- LÍNEA INFERIOR: PROTOCOLO - INICIAR SESIÓN -->
  <div class="protocol-subbar">
    <span class="header-protocol-text">Protocolo - Iniciar Sesión</span>
  </div>

  <div class="form-body">
    
    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form id="formLogin" onsubmit="procesarInicioSesion(event)">

      <div class="form-group">
        <label for="loginEmail">Correo Electrónico</label>
        <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" autocomplete="email" enterkeyhint="next" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" enterkeyhint="done" required>
      </div>

      <button type="submit" class="btn-submit" id="btnLoginSubmit">Iniciar Sesión</button>
    </form>

    <!-- Frase Institucional de Bienvenida -->
    <div class="quote-box">
      <p class="quote-text">"Bienvenido, sumando para compilar la historia del futuro."</p>
      <span class="quote-source">Fuente: Comunidad de la Omnihistoria. omnihistoria.io</span>
    </div>

  </div>

</div>

<script>
  async function generateHash(input) {
    const msgUint8 = new TextEncoder().encode(input.toLowerCase().trim());
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function procesarInicioSesion(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      alert("Por favor ingresa tu correo y contraseña.");
      return;
    }

    const btnSubmit = document.getElementById('btnLoginSubmit');
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Autenticando...";

    try {
      const userHash = await generateHash(`${email}_OMNIH_SALT_2026`);
      sessionStorage.setItem('omnih_active_user', userHash);
      sessionStorage.setItem('omnih_user_email', email);
      sessionStorage.setItem('omnih_first_time', 'false');

      setTimeout(() => {
        window.location.href = 'interfaz-usuario.html';
      }, 600);
    } catch (error) {
      console.error("Error al iniciar sesión:", error);
      alert("Ocurrió un error al intentar autenticar.");
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Iniciar Sesión";
    }
  }

  /* Ajuste de pantalla al desplegar el teclado táctil */
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      document.body.style.minHeight = `${window.visualViewport.height}px`;
    });
  }
</script>
</body>
  </html>
