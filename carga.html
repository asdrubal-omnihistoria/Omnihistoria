<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNIH | Área Carga e Integridad</title>
  <style>
    :root {
      --bg-canvas: #edf2f7;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --accent-gold: #c5a059;
      --border-color: #e2e8f0;
      --btn-bg-light: #ffffff;
      --btn-border: #cbd5e1;
      --icon-blue: #0284c7;
      --text-blue: #0369a1;
      --bg-blue-light: #f0f9ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ENCABEZADO SUPERIOR ESTRUCTURADO */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    /* Arriba a la Izquierda: Elemento de Identidad OMNIH */
    .brand-header-left {
      display: flex;
      align-items: center;
    }

    .brand-logo-img {
      height: 32px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Bloque Derecho: Salir + Área del Convenio */
    .header-right-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    /* Arriba a la Derecha: Salir */
    .link-exit {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }

    .link-exit:hover {
      opacity: 0.7;
    }

    /* Debajo de Salir: Identificador del Convenio */
    .convenio-identity-box {
      background-color: #fcfbf7;
      border: 1px solid #e2d2b4;
      border-radius: 6px;
      padding: 6px 10px;
      text-align: right;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .convenio-identity-box:hover {
      background-color: #f7f0e3;
    }

    .persona-juridica {
      font-size: 0.75rem;
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .hash-convenio {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-gold);
      font-family: monospace;
      margin-top: 2px;
    }

    /* Área de Carga */
    .upload-zone {
      border: 2px dashed var(--accent-gold);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      background-color: #fdfbf7;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .upload-zone:hover {
      background-color: #f9f4ea;
    }

    .upload-icon {
      width: 36px;
      height: 36px;
      margin-bottom: 8px;
      fill: var(--accent-gold);
    }

    .upload-zone h3 {
      font-size: 1rem;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .upload-zone p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Botones de Acción */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-light {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      background-color: var(--btn-bg-light);
      color: var(--text-dark);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-light:hover {
      background-color: #f8fafc;
      border-color: var(--accent-gold);
    }

    .btn-light svg {
      fill: var(--accent-gold);
    }

    /* Módulos Inferiores Azul Celeste */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card-blue {
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 16px;
      background-color: var(--bg-blue-light);
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .card-blue:hover {
      background-color: #e0f2fe;
      transform: translateY(-1px);
    }

    .card-blue .card-icon {
      width: 24px;
      height: 24px;
      fill: var(--icon-blue);
    }

    .card-blue h4 {
      font-size: 0.85rem;
      color: var(--text-blue);
      font-weight: 700;
    }

    .card-blue p {
      font-size: 0.75rem;
      color: var(--text-blue);
      opacity: 0.85;
      line-height: 1.3;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="header-bar">
    <!-- Arriba a la Izquierda: Elemento identitario OMNIH -->
    <div class="brand-header-left">
      <a href="index.html">
        <img src="Screenshot_20260902-152157_1.jpg" alt="OMNIH" class="brand-logo-img">
      </a>
    </div>

    <!-- Bloque Derecho: Salir arriba + Convenio debajo -->
    <div class="header-right-group">
      <a href="#" class="link-exit" onclick="event.preventDefault(); history.back();">
        Salir &rarr;
      </a>

      <div class="convenio-identity-box" onclick="mostrarDetalleConvenio()">
        <div class="persona-juridica" id="entidad-nombre">INSTITUCIÓN VINCULADA</div>
        <div class="hash-convenio" id="convenio-hash">CONVENIO: 0x8F3a...C912</div>
      </div>
    </div>
  </header>

  <div class="upload-zone" onclick="document.getElementById('file-input').click();">
    <svg class="upload-icon" viewBox="0 0 24 24">
      <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
    </svg>
    <h3>Área de Carga</h3>
    <p>Seleccionar o arrastrar documentos institucionales para procesamiento</p>
    <input type="file" id="file-input" multiple onchange="manejarArchivos(this.files)">
  </div>

  <div class="action-buttons">
    <button class="btn-light" onclick="ejecutarCertificacion()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
      </svg>
      Certificar
    </button>

    <button class="btn-light" onclick="ejecutarVerificacion()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
      Verificar Integridad
    </button>
  </div>

  <div class="bottom-grid">
    <div class="card-blue">
      <svg class="card-icon" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
      </svg>
      <h4>Asistente IA</h4>
      <p>Orientación para el buen uso de la interfaz.</p>
    </div>

    <div class="card-blue" onclick="document.getElementById('file-input').click();">
      <svg class="card-icon" viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
      <h4>Subir Fuentes</h4>
      <p>Carga de contexto documental y referencias para la plataforma.</p>
    </div>
  </div>
</div>

<script>
  let archivo = null;
  function manejarArchivos(f) { 
    if(f.length) {
      archivo = f[0];
      alert("Archivo cargado: " + archivo.name);
    } 
  }
  function ejecutarCertificacion() { alert(archivo ? "Certificando: " + archivo.name : "Seleccione un archivo primero."); }
  function ejecutarVerificacion() { alert(archivo ? "Verificando integridad de: " + archivo.name : "Seleccione un archivo primero."); }
  function mostrarDetalleConvenio() { alert("Verificación de Convenio Activo y Persona Jurídica Validada."); }
</script>

</body>
</html>
